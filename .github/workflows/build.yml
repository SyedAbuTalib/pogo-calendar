name: Build calendar

on:
  schedule:
    # Daily at 10:17 UTC (3:17am Pacific)
    - cron: "17 10 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar==7.3.0
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub disables scheduled workflows after 60 days without repo
      # activity; re-enabling on every run resets that timer.
      - run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/build.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
